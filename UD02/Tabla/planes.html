<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla</title>
    <style>
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
        }
        caption {
            font-weight: bold;
            padding: 12px;
        }
        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }
        thead th {
            background-color: blue;
            color: white;
        }
        tbody tr:nth-child(odd) {
            background-color: #f4f6f8;
        }
        tbody tr:nth-child(even) {
            background-color: #e6eef0;
        }
        tbody td:first-of-type{
            text-align: left;
        }
        tfoot th {
            background-color: green;
        }
        tfoot td {
            background-color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <caption>Planes de alojamiento web - NubeTorrent</caption>
        <thead>
            <tr>
                <th colspan="2" rowspan="2">Caracteristicas</th>
                <th colspan="3">Plan</th>
            </tr>
            <tr>
                <th>Basico</th>
                <th>Pro</th>
                <th>Business</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Recursos</th>
                <td>Espacio de disco</td>
                <td>10 GB</td>
                <td>50 GB</td>
                <td>200 GB</td>
            </tr>
            <tr>
                <td>Donimios</td>
                <td>1</td>
                <td>5</td>
                <td>Ilimitado</td>
            </tr>

            <tr>
                <th rowspan="2">Soporte</th>
                <td>Correo electronico</td>
                <td style="color: green;">Si</td>
                <td style="color: green;">Si</td>
                <td style="color: green;">Si</td>
            </tr>
            <tr>
                <td>Telefono 24h</td>
                <td style="color: red;">No</td>
                <td style="color: red;">No</td>
                <td style="color: green;">Si</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">Precio al mes</th>
                <td>3 €</td>
                <td>9 €</td>
                <td>19 €</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
